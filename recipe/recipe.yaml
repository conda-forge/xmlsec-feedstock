schema_version: 1

context:
  version: "1.3.18"

package:
  name: xmlsec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xmlsec/xmlsec-${{ version }}.tar.gz
  sha256: 84e29528b98b623ca3cf0495e46a6973513c0e7a525d23ae642277d6f29890cb

build:
  number: 0
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - libxmlsec1
    - pkg-config
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - pkgconfig
    - lxml >=3.8.0,!=4.7.0
    - libxml2-devel
    - libxmlsec1
    - setuptools
    - setuptools_scm
  run:
    - python
    - lxml >=3.8.0,!=4.7.0

tests:
  - python:
      imports:
        - xmlsec
  - requirements:
      run:
        - pip
    script:
      # Check that the correct version is reported by pip
      - "pip list --format json | grep '{\"name\": \"xmlsec\", \"version\": \"${{ version }}\"}'"

about:
  license: MIT
  license_file: LICENSE
  summary: Python bindings for the XML Security Library
  homepage: https://github.com/mehcode/python-xmlsec

extra:
  recipe-maintainers:
    - jaimergp
    - xhochy
